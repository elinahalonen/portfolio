<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,400;0,500;1,300;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-name">Elina Halonen</a>
      <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html#about">About</a></li>
        <li><a href="ai-in-practice.html">AI in Practice</a></li>
        <li><a href="areas-of-interest.html">Interests</a></li>
        <li><a href="index.html#work">Work</a></li>
        <li><a href="index.html#writing">Writing</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <!-- Optional: <span class="book-tag">Tag line / category</span> -->
          <h1 class="hero-name">Page title</h1>
          <!-- Optional: <p class="hero-tagline">A short subtitle or description.</p> -->
        </div>
      </div>
    </section>

    <!-- SECTION — repeat this block as needed -->
    <section class="section reveal">
      <div class="section-inner">
        <!-- Optional: <h2 class="section-label">Section heading</h2> -->
        <div class="section-content">
          <p>Content goes here.</p>
        </div>
      </div>
    </section>

    <!-- BACK LINK — always last, no reveal class -->
    <section class="section">
      <div class="section-inner">
        <a href="index.html" class="btn btn-outline">&larr; Back to home</a>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 Elina Halonen</span>
    </div>
  </footer>

  <script>
    document.querySelector('.nav-toggle').addEventListener('click', function() {
      document.querySelector('.nav-links').classList.toggle('is-open');
    });
    document.querySelectorAll('.nav-links a').forEach(function(link) {
      link.addEventListener('click', function() {
        document.querySelector('.nav-links').classList.remove('is-open');
      });
    });

    var revealEls = document.querySelectorAll('.reveal');
    revealEls.forEach(function(el) { el.classList.add('reveal-js-ready'); });
    var revealObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.06 });
    revealEls.forEach(function(el) { revealObserver.observe(el); });
  </script>

</body>
</html>
